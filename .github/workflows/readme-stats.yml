name: Update README activity cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-stats.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-activity-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate English activity card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: '{"username":"Gyliardson","show_icons":true,"include_all_commits":true,"hide_rank":true,"card_width":420,"title_color":"58a6ff","text_color":"c9d1d9","icon_color":"58a6ff","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"GitHub Activity","locale":"en"}'
          path: assets/stats/stats-en.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate English language card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: '{"username":"Gyliardson","layout":"compact","langs_count":6,"card_width":420,"size_weight":0.5,"count_weight":0.5,"exclude_repo":"gyliardson","title_color":"58a6ff","text_color":"c9d1d9","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"Most Used Languages","locale":"en"}'
          path: assets/stats/languages-en.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Portuguese activity card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: '{"username":"Gyliardson","show_icons":true,"include_all_commits":true,"hide_rank":true,"card_width":420,"title_color":"58a6ff","text_color":"c9d1d9","icon_color":"58a6ff","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"Atividade no GitHub","locale":"pt-br"}'
          path: assets/stats/stats-pt-br.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Portuguese language card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: '{"username":"Gyliardson","layout":"compact","langs_count":6,"card_width":420,"size_weight":0.5,"count_weight":0.5,"exclude_repo":"gyliardson","title_color":"58a6ff","text_color":"c9d1d9","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"Linguagens mais usadas","locale":"pt-br"}'
          path: assets/stats/languages-pt-br.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Spanish activity card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: '{"username":"Gyliardson","show_icons":true,"include_all_commits":true,"hide_rank":true,"card_width":420,"title_color":"58a6ff","text_color":"c9d1d9","icon_color":"58a6ff","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"Actividad en GitHub","locale":"es"}'
          path: assets/stats/stats-es.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Spanish language card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: '{"username":"Gyliardson","layout":"compact","langs_count":6,"card_width":420,"size_weight":0.5,"count_weight":0.5,"exclude_repo":"gyliardson","title_color":"58a6ff","text_color":"c9d1d9","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"Lenguajes más usados","locale":"es"}'
          path: assets/stats/languages-es.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Japanese activity card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: '{"username":"Gyliardson","show_icons":true,"include_all_commits":true,"hide_rank":true,"card_width":420,"title_color":"58a6ff","text_color":"c9d1d9","icon_color":"58a6ff","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"GitHubでの活動","locale":"ja"}'
          path: assets/stats/stats-ja.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Japanese language card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: '{"username":"Gyliardson","layout":"compact","langs_count":6,"card_width":420,"size_weight":0.5,"count_weight":0.5,"exclude_repo":"gyliardson","title_color":"58a6ff","text_color":"c9d1d9","bg_color":"161b22","border_color":"30363d","border_radius":6,"custom_title":"よく使う言語","locale":"ja"}'
          path: assets/stats/languages-ja.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          if git diff --cached --quiet; then
            echo "README activity cards are already up to date."
            exit 0
          fi
          git commit -m "chore: update README activity cards"
          git push
